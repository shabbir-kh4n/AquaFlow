spring.application.name=hydroledger-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_water}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-before-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175}

app.frontend.url=${FRONTEND_URL:http://localhost:5175}

app.version=${APP_VERSION:0.0.1-dev}

app.system-admin.email=${SYSTEM_ADMIN_EMAIL:sysadmin@hydroledger.local}
app.system-admin.password=${SYSTEM_ADMIN_PASSWORD:dev-only-system-admin-password}
app.system-admin.full-name=${SYSTEM_ADMIN_NAME:System Administrator}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:15000}

chat.rate-limit.capacity=${CHAT_RATE_LIMIT_CAPACITY:10}
chat.rate-limit.refill-per-minute=${CHAT_RATE_LIMIT_REFILL:10}

app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid-subject=${VAPID_SUBJECT:mailto:admin@hydroledger.local}
