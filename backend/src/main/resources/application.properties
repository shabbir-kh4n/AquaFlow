spring.application.name=hydroledger-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_water}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-before-production-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175}

app.frontend.url=${FRONTEND_URL:http://localhost:5175}

app.version=${APP_VERSION:0.0.1-dev}

app.system-admin.email=${SYSTEM_ADMIN_EMAIL:sysadmin@hydroledger.local}
app.system-admin.password=${SYSTEM_ADMIN_PASSWORD:dev-only-system-admin-password}
app.system-admin.full-name=${SYSTEM_ADMIN_NAME:System Administrator}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
